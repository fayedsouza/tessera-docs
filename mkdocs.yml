site_name: Tessera Access Events API
site_description: >-
  Documentation for the Tessera Access Events API — recording, querying and exporting
  access records. A docs-as-code portfolio project by Faye D'Souza.
site_author: Faye D'Souza
site_url: https://fayedsouza.github.io/tessera-docs/

repo_url: https://github.com/fayedsouza/tessera-docs
repo_name: fayedsouza/tessera-docs
edit_uri: edit/main/docs/

copyright: >-
  Documentation portfolio project. Tessera is a fictional product; see the
  <a href="https://github.com/fayedsouza/tessera-docs#readme">repository README</a>.

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Quickstart: get-started/quickstart.md
      - Authenticate with the API: get-started/authentication.md
  - Concepts:
      - concepts/index.md
      - The access model: concepts/access-model.md
      - Events and retention: concepts/events-and-retention.md
      - Tokens and sessions: concepts/tokens-and-sessions.md
  - Guides:
      - guides/index.md
      - Record an access event: guides/record-an-access-event.md
      - Query the audit log: guides/query-the-audit-log.md
      - Export for compliance: guides/export-for-compliance.md
      - Handle rate limits: guides/handle-rate-limits.md
  - Reference:
      - reference/index.md
      - API reference: reference/api.md
      - Error reference: reference/errors.md
      - Glossary: reference/glossary.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - includes
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fayedsouza-techwriter/
      name: Faye D'Souza on LinkedIn
